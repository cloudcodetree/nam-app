name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.gitignore', '.env.example']
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Headless tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The JUCE-free core + tests need no JUCE and no GUI system libs:
      # -DNAM_BUILD_APP=OFF skips fetching/configuring JUCE entirely.
      - name: Configure (core + tests only, no JUCE)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNAM_BUILD_APP=OFF

      - name: Build headless tests
        run: cmake --build build --target nam_tests -j

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  app-build:
    name: App compiles (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Build the full JUCE app on macOS (JUCE configures cleanly there with no
      # extra system deps) so an app-only compile break can't pass CI while the
      # JUCE-free test job stays green.
      - name: Configure (app)
        run: cmake -S . -B build-app -DCMAKE_BUILD_TYPE=Release

      - name: Build NamPlayer
        run: cmake --build build-app --target NamPlayer -j
