plugins {
    id "com.android.application"
}

// Upload-key signing (Task 6, docs/business/play-release-checklist.md). The
// keystore is generated by Chris and NEVER committed; its path + passwords
// live only in ~/.gradle/gradle.properties (outside the repo). On a machine
// without that file -- e.g. a fresh clone, or CI before the keystore exists
// -- signingConfigs.release is simply not created and buildTypes.release
// falls back to AGP's default (unsigned) release build, so
// assembleDebug/bundleRelease both keep working with no keystore present.
def hasUploadSigningProps = project.hasProperty("NAMPLAYER_UPLOAD_STORE_FILE") &&
        project.hasProperty("NAMPLAYER_UPLOAD_STORE_PASSWORD") &&
        project.hasProperty("NAMPLAYER_UPLOAD_KEY_ALIAS") &&
        project.hasProperty("NAMPLAYER_UPLOAD_KEY_PASSWORD")

android {
    namespace "com.namplayer.app"
    compileSdk 35            // JUCE 8.0.15 Android java references API-35 symbols
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "com.namplayer.app"
        minSdk 29
        targetSdk 34
        // Internal-testing track numbering (Task 6, release checklist:
        // docs/business/play-release-checklist.md). Bump versionCode every
        // upload; versionName is the human-facing label.
        versionCode 1
        versionName "1.0.0-internal.1"

        ndk {
            abiFilters "arm64-v8a"   // Phase 5a: S24 Ultra only
        }
        externalNativeBuild {
            cmake {
                // Build the JUCE app target; juce_add_gui_app emits it as a
                // SHARED library (libjuce_jni.so) on Android. c++_shared so the
                // STL is a bundled .so (AGP packages libc++_shared.so too).
                // RelWithDebInfo: the DSP (Eigen/RTNeural NAM inference) is
                // 5-15x slower at -O0; debug APKs must still run models in
                // real time on device.
                arguments "-DNAM_BUILD_APP=ON", "-DANDROID_STL=c++_shared",
                          "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
                targets "NamPlayer"
            }
        }
    }

    externalNativeBuild {
        cmake {
            // Repo root CMakeLists, relative to this app/ module dir
            // (Builds/Android/app -> ../../.. == repo root).
            path "../../../CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        if (hasUploadSigningProps) {
            release {
                storeFile file(NAMPLAYER_UPLOAD_STORE_FILE)
                storePassword NAMPLAYER_UPLOAD_STORE_PASSWORD
                keyAlias NAMPLAYER_UPLOAD_KEY_ALIAS
                keyPassword NAMPLAYER_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            // RelWithDebInfo for native code comes from defaultConfig's
            // externalNativeBuild.cmake.arguments above -- neither buildType
            // overrides it, so debug AND release both build the DSP at
            // RelWithDebInfo (never -O0 debug, never a plain Release that
            // could strip the debug info the crash-symbolication tooling
            // wants). Do not add a per-buildType CMAKE_BUILD_TYPE here.
            if (hasUploadSigningProps) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Play Billing Library version JUCE 9.0.1's bundled JuceBillingClient.java
    // (native/java/app/com/rmsl/juce/JuceBillingClient.java) targets -- matches
    // extras/Projucer/Source/ProjectSaving/jucer_ProjectExport_Android.h's
    // hardcoded Android-exporter dependency line for this JUCE tag. Billing spike
    // re-spike, docs/business/billing-spike.md: JUCE's product-unlocking module
    // resolves com/android/billingclient/api/* classes eagerly at
    // System.loadLibrary time, so this jar must be on the classpath from the
    // first launch, not just when a purchase flow runs.
    implementation('com.android.billingclient:billing:9.1.0') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}
